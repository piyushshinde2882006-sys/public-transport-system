<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Public Transport Information System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f6fa;
            color: #222;
        }

        header {
            background: linear-gradient(135deg, #0066cc, #00a8ff);
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 8px;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .search-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .search-box h2 {
            color: #0066cc;
            margin-bottom: 20px;
        }

        .form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 150px;
            gap: 15px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0066cc;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #004c99;
        }

        #result {
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #0066cc;
            margin-bottom: 15px;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .info div {
            background: #eef6ff;
            padding: 10px;
            border-radius: 6px;
        }

        .error {
            background: #ffe5e5;
            color: #c00000;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .success {
            background: #e5f8eb;
            color: #16752f;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .welcome {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        footer {
            margin-top: 40px;
            background: #123;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 800px) {
            .form {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 500px) {
            .form {
                grid-template-columns: 1fr;
            }

            .info {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🚌 Public Transport Information System</h1>
    <p>Find Bus & Train Information</p>
</header>

<div class="container">

    <div class="search-box">

        <h2>🔎 Search Transport</h2>

        <div class="form">

            <input
                type="text"
                id="source"
                placeholder="Enter Source"
            >

            <input
                type="text"
                id="destination"
                placeholder="Enter Destination"
            >

            <select id="transport">
                <option value="all">All Transport</option>
                <option value="Bus">Bus</option>
                <option value="Train">Train</option>
            </select>

            <button id="searchBtn">
                Search
            </button>

        </div>

    </div>

    <div id="result">

        <div class="welcome">
            <h2>🚍 Welcome</h2>
            <p>
                Enter source and destination to find available
                public transport.
            </p>
        </div>

    </div>

</div>

<footer>
    <p>Public Transport Information System</p>
    <p>HTML5 • CSS3 • JavaScript</p>
</footer>


<script>

    /* Transport Data */

    const transportData = [

        {
            type: "Bus",
            number: "BUS-101",
            name: "City Express",
            source: "Pandharpur",
            destination: "Solapur",
            timing: "08:30 AM",
            stops: "5 Stops",
            fare: "₹30"
        },

        {
            type: "Bus",
            number: "BUS-102",
            name: "Maharashtra Express",
            source: "Pune",
            destination: "Mumbai",
            timing: "09:15 AM",
            stops: "8 Stops",
            fare: "₹150"
        },

        {
            type: "Bus",
            number: "BUS-103",
            name: "City Link",
            source: "Solapur",
            destination: "Pandharpur",
            timing: "11:00 AM",
            stops: "6 Stops",
            fare: "₹40"
        },

        {
            type: "Train",
            number: "TR-201",
            name: "Passenger Express",
            source: "Pandharpur",
            destination: "Solapur",
            timing: "10:15 AM",
            stops: "8 Stops",
            fare: "₹45"
        },

        {
            type: "Train",
            number: "TR-202",
            name: "Pune Express",
            source: "Pune",
            destination: "Mumbai",
            timing: "06:30 AM",
            stops: "12 Stops",
            fare: "₹120"
        },

        {
            type: "Train",
            number: "TR-203",
            name: "Deccan Express",
            source: "Mumbai",
            destination: "Pune",
            timing: "07:45 AM",
            stops: "10 Stops",
            fare: "₹100"
        }

    ];


    /* Search Function */

    function searchTransport() {

        const source =
            document.getElementById("source")
            .value
            .trim()
            .toLowerCase();

        const destination =
            document.getElementById("destination")
            .value
            .trim()
            .toLowerCase();

        const transport =
            document.getElementById("transport").value;

        const result =
            document.getElementById("result");


        /* Check empty fields */

        if (source === "" || destination === "") {

            result.innerHTML = `
                <div class="error">
                    ⚠️ Please enter Source and Destination.
                </div>
            `;

            return;
        }


        /* Find matching transport */

        const results = transportData.filter(function(item) {

            const sourceMatch =
                item.source.toLowerCase() === source;

            const destinationMatch =
                item.destination.toLowerCase() === destination;

            const typeMatch =
                transport === "all" ||
                item.type === transport;

            return sourceMatch &&
                   destinationMatch &&
                   typeMatch;
        });


        displayResults(results);
    }


    /* Display Results */

    function displayResults(data) {

        const result =
            document.getElementById("result");


        if (data.length === 0) {

            result.innerHTML = `
                <div class="error">
                    ❌ No transport found.
                    <br><br>
                    Try:
                    <b>Pandharpur → Solapur</b>
                    or
                    <b>Pune → Mumbai</b>
                </div>
            `;

            return;
        }


        result.innerHTML = `
            <div class="success">
                ✅ ${data.length} transport option(s) found.
            </div>
        `;


        data.forEach(function(item) {

            const icon =
                item.type === "Bus"
                ? "🚌"
                : "🚆";


            result.innerHTML += `

                <div class="card">

                    <h3>
                        ${icon} ${item.name}
                    </h3>

                    <div class="info">

                        <div>
                            <b>Transport No:</b>
                            ${item.number}
                        </div>

                        <div>
                            <b>Type:</b>
                            ${item.type}
                        </div>

                        <div>
                            <b>Source:</b>
                            ${item.source}
                        </div>

                        <div>
                            <b>Destination:</b>
                            ${item.destination}
                        </div>

                        <div>
                            <b>Timing:</b>
                            ${item.timing}
                        </div>

                        <div>
                            <b>Stops:</b>
                            ${item.stops}
                        </div>

                        <div>
                            <b>Fare:</b>
                            ${item.fare}
                        </div>

                        <div>
                            <b>Status:</b>
                            Available
                        </div>

                    </div>

                </div>

            `;

        });

    }


    /* Button Click */

    document
        .getElementById("searchBtn")
        .addEventListener("click", searchTransport);


    /* Enter Key */

    document
        .getElementById("source")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                searchTransport();
            }

        });


    document
        .getElementById("destination")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                searchTransport();
            }

        });

</script>

</body>
</html>
